- source_id: arlington_re_property
  jurisdiction: arlington
  custodian: "Department of Real Estate Assessments (Arlington Open Data / datahub-v2)"
  dataset_name: "Real Estate Property"
  quoin_sections: [identity, land, building]
  access_type: api
  cost: free
  format: "JSON API (OData-style $top paging), plus a pipe/text bulk file"
  landing_url: "https://data.arlingtonva.us"
  endpoint_url: "https://datahub-v2.arlingtonva.us/api/RealEstate/Property"
  parcel_key: "RPC (RealEstatePropertyCode)"
  update_frequency: unknown
  history_start: unknown
  terms: "Free to share and adapt, but users must display the notice 'Arlington County Data API was used for this purpose, but it is not endorsed or certified by Arlington County.'"
  notes: "Owner-name fields (firstOwnerName, secondOwnerName, additionalOwnerText, compressedOwnerText) read 'Redacted' in all sampled rows. Owner mailing address IS present. Also has legal description, lot size, zoning list, year built, GFA, units, landRecordDocumentNbr and lat/long. Bulk assessment file: https://download.data.arlingtonva.us/RealEstate/Assessment.txt.gz (25.5 MB, refreshed daily). No swagger or $metadata; docs.data.arlingtonva.us says no token is needed but use is throttled."
  evidence_urls:
    - "https://catalog.data.gov/dataset/property"
    - "https://us-cities.survey.okfn.org/entry/arlingtonva/property-assessment.html"
  official_source: "Arlington County Department of Real Estate Assessments"
  verified_at: "2026-10-11"

