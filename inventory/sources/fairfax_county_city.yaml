# Fairfax County and City of Fairfax.
# Found by web search on 2026-10-11. URLs have not been fetched or verified yet (verified_at: null).
# Land records are under va_fairfax_circuit_court_cpan and ABC licenses under va_abc_licensees, both in virginia_state_regional.yaml.

# ---------------- FAIRFAX COUNTY ----------------
# The DTA real estate tables are the closest equivalent to D.C. CAMA and are linked by PARID.
# Data.gov lists them, and they are served from the county ArcGIS Hub (data-fairfaxcountygis.opendata.arcgis.com).
# Some are in the OpenData_A5 FeatureServer (services1.arcgis.com/ioennV6PpG5Xodq0/ArcGIS/rest/services/OpenData_A5/FeatureServer).
# Layer IDs still need to be read from that service's /layers listing before endpoint_url can be filled in.
- source_id: fairfax_county_dta_re_parcels
  jurisdiction: fairfax_county
  custodian: "Department of Tax Administration (DTA), published by DIT-GIS"
  dataset_name: "Tax Administration's Real Estate - Parcels Data"
  quoin_sections: [identity, land, building]
  access_type: bulk
  cost: free
  format: "CSV, GeoJSON, ArcGIS REST table"
  landing_url: "https://catalog.data.gov/dataset/tax-administrations-real-estate-parcels-data-cc892"
  endpoint_url: null
  parcel_key: "PARID (tax map reference number)"
  update_frequency: unknown
  history_start: unknown
  terms: "County GIS disclaimer"
  notes: "Livable units, land use code, zoning and utilities. This is the table the other DTA tables join to."
