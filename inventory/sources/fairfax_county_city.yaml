  custodian: "Department of Tax Administration (DTA), published by DIT-GIS"
  dataset_name: "Tax Administration's Real Estate - Parcels Data"
  quoin_sections: [identity, land, building]
  access_type: "api"
  cost: free
  format: "CSV, GeoJSON, ArcGIS REST table"
