# Virginia state-level and Northern Virginia regional sources.
# Entries without `covers:` apply to all six jurisdictions.
# Discovered via web search on 2026-10-11; URLs not yet fetched/verified (verified_at: null).
- source_id: va_sra_covers_land_records
  jurisdiction: virginia_state
  covers: [alexandria]
  custodian: "Supreme Court of Virginia, Office of the Executive Secretary (OES), and participating Circuit Court Clerks"
  dataset_name: "Secure Remote Access (SRA) to circuit court land records, run on COVERS"
  quoin_sections: [ownership, transfer, deed_reference]
  access_type: paid
  cost: "Set by each clerk, capped at $50/month by Va. Code 17.1-276 (Alexandria charges $50/mo or $500/yr); VJOPS adds a 4% fee"
  format: "Web viewer: index search and scanned document images, with no bulk export"
  landing_url: "https://courts.state.va.us/online/sra/home"
  endpoint_url: null
  parcel_key: null
  update_frequency: "Continuous, as documents are recorded"
  history_start: "Varies by clerk (Alexandria deed images start 1970-01-02)"
  terms: "The clerk approves each subscriber and a subscriber agreement is required. Va. Code 17.1-294(D) and VITA SEC503 apply. Redistribution is not allowed."
  notes: "Of the six jurisdictions, only Alexandria is confirmed on SRA/COVERS. Arlington, Fairfax and Loudoun run their own systems (see their entries). I could not read the SRA 'Available Courts' list."
  evidence_urls:
    - "https://courts.state.va.us/online/sra/home"
    - "https://law.lis.virginia.gov/vacode/17.1-294/"
    - "https://alexandriava.gov/courtrecords"
    - "https://alexandriava.gov/sites/default/files/2024-08/remote_access_subscriber_agreement_-_covers_-_alexandria_clerk_of_circuit_court.pdf"
  verified_at: null

- source_id: va_arlington_circuit_court_land_records
  jurisdiction: virginia_state
  covers: [arlington, falls_church]
  custodian: "Clerk of the Arlington County Circuit Court, Land Records Division"
  dataset_name: "Arlington Circuit Court Official Records Search (land records index and images)"
  quoin_sections: [ownership, transfer, deed_reference]
  access_type: paid
  cost: "Index is free with a registered account. Images are $0.50/page plus $2.00 per transaction. Subscription is $50/month or $600/year (notarized application)."
  format: "Web search portal (GovOS publicsearch at arlington.va.publicsearch.us): index and images"
  landing_url: "https://www.arlingtonva.us/Government/Departments/Courts/Circuit-Court/Land-Records"
  endpoint_url: null
  parcel_key: null
  update_frequency: "Continuous"
  history_start: "1869 (secondary source)"
  terms: "Va. Code 17.1-294(D), plus the site's Disclaimer and Conditions of Use"
  notes: "Covers Arlington County, and Falls Church records from 1988 on. Falls Church records from before 1988 are held by the Fairfax Circuit Court."
  evidence_urls:
    - "https://www.arlingtonva.us/Government/Departments/Courts/Circuit-Court/Land-Records"
    - "https://www.arlingtonva.us/Government/Departments/Courts/Circuit-Court/Land-Records/Land-Records-FAQs"
    - "https://landrec.arlingtonva.us/public/sign-up-instructions.html"
  verified_at: null

- source_id: va_fairfax_circuit_court_cpan
  jurisdiction: virginia_state
  covers: [fairfax_county, fairfax_city, falls_church]
  custodian: "Clerk of the Fairfax Circuit Court, Land Records Division"
  dataset_name: "Court Public Access Network (CPAN), Fairfax Circuit Court land records"
  quoin_sections: [ownership, transfer, deed_reference]
  access_type: paid
  cost: "Conflicting reports: $150 per user per quarter (older) or $50/month (Dec 2023 CPAN agreement). Free at courthouse terminals. Certified copies are $2.00/document plus $0.50/page."
  format: "Remote subscription viewer: index and document images"
  landing_url: "https://www.fairfaxcounty.gov/circuit/land-records/research"
  endpoint_url: null
  parcel_key: null
  update_frequency: "Continuous"
  history_start: "1742"
  terms: "Per-user subscription"
  notes: "Covers Fairfax County, the City of Fairfax, and Falls Church records from before 1988. Also carries judgments and liens (tax liens could hint at delinquency, but this is not counted as delinquency coverage). Not part of SRA/COVERS. Press has described it as the region's most restrictive paywall (InsideNova, 2021)."
  evidence_urls:
    - "https://www.fairfaxcounty.gov/circuit/land-records/research"
    - "https://www.fairfaxcounty.gov/circuit/land-records/general-information"
    - "https://www.insidenova.com/headlines/amid-push-for-online-access-to-court-records-fairfax-county-paywall-stands-alone/article_a559ed40-5c29-11ec-95b2-e7f41d404e0a.html"
  verified_at: null

